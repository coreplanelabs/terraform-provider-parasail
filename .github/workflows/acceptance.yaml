---
name: acceptance

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Live test scope (mutating creates billable deployments)
        type: choice
        default: readonly
        options:
          - readonly
          - mutating

permissions:
  contents: read

env:
  CI: "true"

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    environment: acceptance
    env:
      PARASAIL_API_KEY: ${{ secrets.PARASAIL_API_KEY }}
      TEST_MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"

      - name: Check Parasail credentials
        run: test -n "$PARASAIL_API_KEY"

      - name: Run live acceptance tests
        run: |
          if [ "$TEST_MODE" = mutating ]; then
            task test:acc
          else
            task test:acc:readonly
          fi
