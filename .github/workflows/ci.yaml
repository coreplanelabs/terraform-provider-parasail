---
name: ci

"on":
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CI: "true"

jobs:
  do:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task:
          - format
          - lint
          - examples:validate
          - docs
          - test
          - security
          - build
          - lint:workflows
          - release:check
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"

      - name: Run task
        run: task ${{ matrix.task }}

      - name: Upload Coreplane provider binary
        if: matrix.task == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-provider-parasail-linux-amd64
          path: dist/terraform-provider-parasail
          if-no-files-found: error

      - name: Verify generated files are committed
        run: git diff --exit-code

  check:
    if: always()
    needs:
      - do
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
